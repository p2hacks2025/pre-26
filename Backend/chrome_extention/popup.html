<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 220px; padding: 15px; font-family: sans-serif; }
    h3 { margin-top: 0; font-size: 16px; }
    button {
      width: 100%; padding: 10px; margin-top: 10px;
      background-color: #4285f4; color: white;
      border: none; border-radius: 4px; cursor: pointer;
    }
    button:hover { background-color: #357ae8; }
    #status { margin-top: 10px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h3>Browse Logger</h3>
  <div id="countDisplay">読み込み中...</div>
  <button id="exportBtn">最新ログを保存 (JSON)</button>
  <button id="clearBtn" style="background-color: #d93025; margin-top: 5px;">ログ消去</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
