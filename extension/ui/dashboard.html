<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History Visualizer</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div id="controls">
    <h1>History Visualizer</h1>
    <div class="control-group">
      <label for="range-select">解析範囲:</label>
      <select id="range-select">
        <option value="1">過去1時間</option>
        <option value="24" selected>過去24時間</option>
        <option value="168">過去1週間</option>
        <option value="720">過去30日</option>
      </select>
      <button id="sync-btn">同期</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="graph-container">
    <div id="graph"></div>
  </div>

  <div id="sidebar">
    <div id="recommend-section">
      <h2>おすすめ検索ワード</h2>
      <ul id="recommend-list"></ul>
    </div>
    <div id="suggest-section">
      <h2>次の検索場所を提案</h2>
      <div class="suggest-controls">
        <p>グラフ上のノードを2つクリックして選択してください</p>
        <div id="selected-nodes">
          <span id="selected-node-1" class="selected-node-label">未選択</span>
          <span class="arrow">→</span>
          <span id="selected-node-2" class="selected-node-label">未選択</span>
        </div>
        <button id="reset-selection-btn">選択をリセット</button>
      </div>
      <div id="suggest-status"></div>
      <ul id="suggest-list"></ul>
    </div>
  </div>

  <script src="../vendor/plotly.min.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
