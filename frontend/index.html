<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Live Knowledge Graph (Debug)</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #graph_area { flex: 1; border: 1px solid #ddd; border-radius: 8px; position: relative; min-height: 400px; /* ★高さを確保 */ }
        button { padding: 8px 16px; cursor: pointer; background: #4285f4; color: white; border: none; border-radius: 4px; font-size: 14px; }
        button:hover { background: #357ae8; }
        button.danger { background: #d93025; margin-left: 10px; }
        button.danger:hover { background: #b02a20; }
        #status { color: #666; font-size: 0.9em; margin-right: 10px; }
        #debug_log { margin-top: 10px; padding: 10px; background: #f0f0f0; border: 1px solid #ccc; font-family: monospace; font-size: 12px; height: 100px; overflow-y: scroll; display: none; }
    </style>
</head>
<body>
    <header>
        <h2>Live Browsing Graph</h2>
        <div>
            <span id="status">Ready</span>
            <button onclick="fetchGraph()">グラフ更新</button>
            <button class="danger" onclick="clearLogs()">ログ消去</button>
            <button onclick="toggleDebug()" style="background:#777; margin-left:10px;">デバッグ表示</button>
        </div>
    </header>
    
    <div id="graph_area">Loading...</div>
    <div id="debug_log"></div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        function log(msg) {
            console.log(msg);
            const logDiv = document.getElementById('debug_log');
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()} ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function toggleDebug() {
            const d = document.getElementById('debug_log');
            d.style.display = d.style.display === 'none' ? 'block' : 'none';
        }

        // グラフデータの取得と描画
        async function fetchGraph() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Updating...";
            log("Fetching graph data...");
            
            try {
                // キャッシュ回避のためにタイムスタンプを付与
                const response = await fetch(`${API_URL}/api/graph?t=${new Date().getTime()}`);
                
                if (!response.ok) throw new Error(`Server returned ${response.status}`);
                
                const fig = await response.json();
                log(`Received Data: ${JSON.stringify(fig).substring(0, 100)}...`); // データの先頭を表示
                
                // データチェック
                if (!fig || !fig.data || fig.data.length === 0) {
                    log("Data is empty.");
                    document.getElementById('graph_area').innerText = "データがありません。サーバーにログが届いていない可能性があります。";
                    statusEl.innerText = "No Data";
                    return;
                }

                log(`Traces found: ${fig.data.length} items`);

                // 描画
                document.getElementById('graph_area').innerText = ""; 
                await Plotly.newPlot('graph_area', fig.data, fig.layout);
                log("Graph plotted successfully.");

                // クリックイベント
                const myPlot = document.getElementById('graph_area');
                myPlot.removeAllListeners('plotly_click'); // 重複防止
                myPlot.on('plotly_click', function(data){
                    if (data.points.length > 0) {
                        const pathText = data.points[0].customdata;
                        if (pathText) alert("【始点からの道のり】\n\n" + pathText);
                    }
                });
                
                statusEl.innerText = "Updated";

            } catch (e) {
                console.error(e);
                log(`Error: ${e.message}`);
                document.getElementById('graph_area').innerText = "エラー:\n" + e.message;
                statusEl.innerText = "Error";
            }
        }

        async function clearLogs() {
            if(confirm("ログを消去しますか？")) {
                await fetch(`${API_URL}/api/logs`, { method: 'DELETE' });
                fetchGraph();
            }
        }

        // 初回実行
        fetchGraph();
    </script>
</body>
</html>
